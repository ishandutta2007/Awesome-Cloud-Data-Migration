<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="streamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 21px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #cbd5e1;
    }

    /* Ambient Pulsing Animations */
    @keyframes orbPulse {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes orbPulse2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.5; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .ambient-orb-1 {
      animation: orbPulse 8s ease-in-out infinite;
      transform-origin: 220px 90px;
    }
    .ambient-orb-2 {
      animation: orbPulse2 10s ease-in-out infinite;
      transform-origin: 1020px 290px;
    }
    .stream-line {
      stroke-dasharray: 12, 16;
      animation: dashStream 25s linear infinite;
    }
    .stream-line-fast {
      stroke-dasharray: 8, 12;
      animation: dashStream 16s linear infinite;
    }
    .data-node {
      animation: pulseNode 3s ease-in-out infinite alternate;
      transform-origin: center;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>

  <!-- Subtle Matrix / Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" stroke-dasharray="4,8"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke-dasharray="4,8"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke-dasharray="4,8"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke-dasharray="4,8"/>
    <line x1="150" y1="0" x2="150" y2="400" stroke-dasharray="4,8"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke-dasharray="4,8"/>
    <line x1="650" y1="0" x2="650" y2="400" stroke-dasharray="4,8"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke-dasharray="4,8"/>
    <line x1="1050" y1="0" x2="1050" y2="400" stroke-dasharray="4,8"/>
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="ambient-orb-1">
    <circle cx="220" cy="90" r="160" fill="#38bdf8" opacity="0.22" filter="url(#glow)"/>
    <circle cx="180" cy="140" r="110" fill="#6366f1" opacity="0.2" filter="url(#glow)"/>
  </g>
  <g class="ambient-orb-2">
    <circle cx="1020" cy="290" r="170" fill="#a855f7" opacity="0.2" filter="url(#glow)"/>
    <circle cx="960" cy="220" r="120" fill="#06b6d4" opacity="0.18" filter="url(#glow)"/>
  </g>

  <!-- Flowing Dynamic Pipeline Streams (Background Depth) -->
  <path class="stream-line" d="M -50 320 C 300 370, 450 180, 800 240 C 1000 280, 1100 130, 1250 150" fill="none" stroke="url(#streamGradient)" stroke-width="3"/>
  <path class="stream-line-fast" d="M -50 100 C 250 50, 500 260, 850 140 C 1050 70, 1150 260, 1250 230" fill="none" stroke="url(#streamGradient)" stroke-width="2" opacity="0.7"/>

  <!-- High-Tech Data Network Nodes (Subtle, non-interfering) -->
  <g opacity="0.4">
    <circle cx="120" cy="280" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="1080" cy="120" r="5" fill="#c084fc" filter="url(#softGlow)"/>
    <circle cx="980" cy="90" r="3" fill="#818cf8"/>
    <circle cx="140" cy="70" r="3.5" fill="#06b6d4"/>
    <line x1="120" y1="280" x2="170" y2="320" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="1080" y1="120" x2="980" y2="90" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
  </g>

  <!-- Center Foreground Content (Crisp, perfectly legible, non-obscured) -->
  <g transform="translate(80, 45)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 15)">
      <rect width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="18" cy="16" r="4.5" fill="#38bdf8" filter="url(#softGlow)"/>
      <text x="32" y="21" class="badge-text">ENTERPRISE &amp; OPEN-SOURCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="110" class="title-text" fill="url(#textGradient)" filter="url(#softGlow)">
      Awesome Cloud Data Migration
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="155" class="subtitle-text">
      Curated Landscape of Modern ELT Pipelines, CDC Replication &amp; Data Integration
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: ELT / ETL -->
      <g transform="translate(0, 0)">
        <rect width="130" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="65" y="23" text-anchor="middle" class="pill-text">🔄 ELT &amp; ETL</text>
      </g>
      <!-- Pill 2: CDC Replication -->
      <g transform="translate(145, 0)">
        <rect width="165" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="82.5" y="23" text-anchor="middle" class="pill-text">⚡ CDC Replication</text>
      </g>
      <!-- Pill 3: Lakehouses & Warehouses -->
      <g transform="translate(325, 0)">
        <rect width="215" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="107.5" y="23" text-anchor="middle" class="pill-text">🏛️ Lakehouses &amp; Warehouses</text>
      </g>
      <!-- Pill 4: Open Connectors -->
      <g transform="translate(555, 0)">
        <rect width="180" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="90" y="23" text-anchor="middle" class="pill-text">🔌 600+ Connectors</text>
      </g>
      <!-- Pill 5: AI & Agent Ready -->
      <g transform="translate(750, 0)">
        <rect width="175" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="87.5" y="23" text-anchor="middle" class="pill-text">🤖 AI &amp; Agent Ready</text>
      </g>
    </g>
  </g>
</svg>