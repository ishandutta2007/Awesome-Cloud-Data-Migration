<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#060913"/></linearGradient><linearGradient id="textGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="80%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="streamGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes orbPulse{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(20px,-15px);opacity:.55}}@keyframes orbPulse2{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.2) translate(-25px,20px);opacity:.5}}@keyframes dashStream{0%{stroke-dashoffset:1000}}@keyframes pulseNode{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}.title-text{font-weight:800;font-size:52px;letter-spacing:-.5px}.badge-text,.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:21px;fill:#94a3b8;letter-spacing:.2px}.badge-text,.pill-text{font-size:13px}.badge-text{font-weight:600;fill:#38bdf8;letter-spacing:1px}.pill-text{font-weight:500;fill:#cbd5e1}.ambient-orb-1{animation:orbPulse 8s ease-in-out infinite;transform-origin:220px 90px}.ambient-orb-2{animation:orbPulse2 10s ease-in-out infinite;transform-origin:1020px 290px}.stream-line{stroke-dasharray:12,16;animation:dashStream 25s linear infinite}.stream-line-fast{stroke-dasharray:8,12;animation:dashStream 16s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGradient)"/><g stroke="#38bdf8" stroke-width="1" opacity=".12"><line x1="0" x2="1200" y1="80" y2="80" stroke-dasharray="4 8"/><line x1="0" x2="1200" y1="160" y2="160" stroke-dasharray="4 8"/><line x1="0" x2="1200" y1="240" y2="240" stroke-dasharray="4 8"/><line x1="0" x2="1200" y1="320" y2="320" stroke-dasharray="4 8"/><line x1="150" x2="150" y1="0" y2="400" stroke-dasharray="4 8"/><line x1="400" x2="400" y1="0" y2="400" stroke-dasharray="4 8"/><line x1="650" x2="650" y1="0" y2="400" stroke-dasharray="4 8"/><line x1="900" x2="900" y1="0" y2="400" stroke-dasharray="4 8"/><line x1="1050" x2="1050" y1="0" y2="400" stroke-dasharray="4 8"/></g><g class="ambient-orb-1"><circle cx="220" cy="90" r="160" fill="#38bdf8" filter="url(#glow)" opacity=".22"/><circle cx="180" cy="140" r="110" fill="#6366f1" filter="url(#glow)" opacity=".2"/></g><g class="ambient-orb-2"><circle cx="1020" cy="290" r="170" fill="#a855f7" filter="url(#glow)" opacity=".2"/><circle cx="960" cy="220" r="120" fill="#06b6d4" filter="url(#glow)" opacity=".18"/></g><path fill="none" stroke="url(#streamGradient)" stroke-width="3" d="M -50 320 C 300 370, 450 180, 800 240 C 1000 280, 1100 130, 1250 150" class="stream-line"/><path fill="none" stroke="url(#streamGradient)" stroke-width="2" d="M -50 100 C 250 50, 500 260, 850 140 C 1050 70, 1150 260, 1250 230" class="stream-line-fast" opacity=".7"/><g opacity=".4"><circle cx="120" cy="280" r="4" fill="#38bdf8" filter="url(#softGlow)"/><circle cx="1080" cy="120" r="5" fill="#c084fc" filter="url(#softGlow)"/><circle cx="980" cy="90" r="3" fill="#818cf8"/><circle cx="140" cy="70" r="3.5" fill="#06b6d4"/><line x1="120" x2="170" y1="280" y2="320" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1"/><line x1="1080" x2="980" y1="120" y2="90" stroke="#c084fc" stroke-opacity=".4" stroke-width="1"/></g><g><g transform="translate(80, 45) translate(0, 15)"><rect width="320" height="32" fill="#1e293b" fill-opacity=".85" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="4.5" fill="#38bdf8" filter="url(#softGlow)"/><text x="32" y="21" class="badge-text">ENTERPRISE &amp; OPEN-SOURCE</text></g><text x="0" y="110" fill="url(#textGradient)" class="title-text" filter="url(#softGlow)" transform="translate(80, 45)">Awesome Cloud Data Migration</text><text x="0" y="155" class="subtitle-text" transform="translate(80, 45)">Curated Landscape of Modern ELT Pipelines, CDC Replication &amp; Data Integration</text><g><g transform="translate(80, 45) translate(0, 195) translate(0, 0)"><rect width="130" height="36" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="10"/><text x="65" y="23" class="pill-text" text-anchor="middle">🔄 ELT &amp; ETL</text></g><g transform="translate(80, 45) translate(0, 195) translate(145, 0)"><rect width="165" height="36" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="10"/><text x="82.5" y="23" class="pill-text" text-anchor="middle">⚡ CDC Replication</text></g><g transform="translate(80, 45) translate(0, 195) translate(325, 0)"><rect width="215" height="36" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="10"/><text x="107.5" y="23" class="pill-text" text-anchor="middle">🏛️ Lakehouses &amp; Warehouses</text></g><g transform="translate(80, 45) translate(0, 195) translate(555, 0)"><rect width="180" height="36" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="10"/><text x="90"